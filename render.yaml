services:
  - type: web
    name: zenglian-ai-tutor
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: API_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://zenglian-ai-tutor.onrender.com,http://localhost:5173
      - key: REQUIRE_AUTH
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: gemini-2.5-flash

