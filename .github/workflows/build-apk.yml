name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build ZengLian AI Tutor APK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies and build web assets
        run: |
          cd client
          npm install
          npm run build
          npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Prepare APK release artifact
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.3.1.apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.3.0.apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.0.0.apk
          ls -lh ./ZengLian_AI_Tutor_v1*.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZengLian_AI_Tutor_v1.3.1
          path: ./ZengLian_AI_Tutor_v1.3.1.apk
          retention-days: 30

      - name: Create or Update v1.3.1 Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.3.1
          name: "曾练专属私教 v1.3.1 - 全机型高清独立语音通道与秒级朗读 (最新发布)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 📱 曾练专属私教 v1.3.1 (Build 2026.09.21)

            - 🔊 **全机型独立高保真语音通道**：彻底解决部分安卓手机（三星/小米/华为）WebView 自带语音包缺失导致的无法朗读或静音问题。
            - ⚡ **秒级极速流式响应**：升级多语块智能拼接与内存极速缓存，点击朗读即刻出声。
            - 📱 **原生 Android 深度适配**：版本升级为 v1.3.1 (versionCode 4)，支持无缝覆盖安装更新。
            - 🔒 **全链路安全防护与向量检索**：已脱敏全量密钥，内置 1-9 年级教材向量索引库。

            ---
            ### 🤖 安卓端下载与安装 (Android APK)：
            1. 点击下方 Assets 列表中的 **`ZengLian_AI_Tutor_v1.3.1.apk`** 直接下载；
            2. 在安卓手机或平板文件管理器中打开该 APK 进行安装（或直接覆盖更新）；
            3. 安装完成后，手机桌面上将出现 **【曾练专属私教】** 应用图标，点开即用！
          files: |
            ./ZengLian_AI_Tutor_v1.3.1.apk
            ./ZengLian_AI_Tutor_v1.3.0.apk
            ./ZengLian_AI_Tutor_v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to v1.3.0 and v1.0.0-apk Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.3.0
          name: "曾练专属私教 v1.3.0 - 0秒即读本地原声与全平台自适配更新"
          draft: false
          prerelease: false
          files: |
            ./ZengLian_AI_Tutor_v1.3.1.apk
            ./ZengLian_AI_Tutor_v1.3.0.apk
            ./ZengLian_AI_Tutor_v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
