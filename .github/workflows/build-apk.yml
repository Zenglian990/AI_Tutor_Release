name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build ZengLian AI Tutor APK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies and build web assets
        run: |
          cd client
          npm install
          VITE_API_URL=https://ai-tutor-79709693345.asia-east1.run.app npm run build
          npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Prepare APK release artifact
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./AI_Tutor_v1.6.2.apk
          curl -sL https://github.com/Zenglian990/AI_Tutor_Release/releases/download/v1.6.1/AI_Tutor_v1.6.1.apk -o ./AI_Tutor_v1.6.1.apk || true
          ls -lh ./AI_Tutor_v1*.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Tutor_v1.6.2
          path: ./AI_Tutor_v1.6.2.apk
          retention-days: 30

      - name: Create or Update v1.6.2 Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.6.2
          name: "曾练专属私教 v1.6.2 - 三位一体认知架构·苏格拉底脚手架·续学断点记忆·小初高全科 (断续学习免从头讲起)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚀 曾练专属私教 v1.6.2 (三位一体认知架构 · 续学断点记忆 · 苏格拉底启发式教辅)

            - 📍 **学习断点记录与续学锚点引擎（免从头学起 · 核心技术突破）**：
              - 自动捕捉学生上一次学习退出的精准章节、未解疑惑点与下一讲预备目标；
              - 学生断断续续学习、隔几天再打开时，智能体无缝衔接上次断点，主动发起续学唤醒，**绝不用每次从头讲起**！
            - 🏛️ **苏格拉底启发式教学门禁机制 (Socratic Scaffolding Gate)**：
              - 严守三阶段启发式推进：**概念探索发现 (Discovery) ➔ 台阶式脚手架拆解 (Scaffolding) ➔ 总结巩固反思 (Consolidation)**；
              - 彻底消除 AI 教学直接倾倒答案的弊端，点拨思路诱发学生主动顿悟！
            - 🧠 **L1-L3 动态认知状态演化记忆 (Auditable Cognitive State)**：
              - 毫秒级量化掌握度分值（0.0 ~ 1.0），自动标记掌握（mastered）、薄弱不稳定（unstable）与认知断层（gapped）；
              - 精准定位前置基础漏洞（如因式分解不稳导致二次函数受阻），动态调度靶向练习。
            - 🗺️ **多模态母题与可视化锚点增强 (Multimodal Visual Anchors)**：
              - 几何与函数核心考点（全等三角形、勾股定理、一次/二次函数）挂载可视化母题模型与动态图示。
            - 💯 **全栈极速高质量工程交付**：
              - 175 项服务端单元与集成测试用例全绿通过，28 项客户端核心组件用例 100% 验证！

            ---
            ### 🤖 安卓端下载与安装 (Android APK)：
            1. 点击下方 Assets 列表中的 **`AI_Tutor_v1.6.2.apk`** 直接下载安装；
            2. 安装后手机桌面将更新至 **【曾练专属私教 v1.6.2】**，点开即用！
            *(按照规范，发布区严格保持最新的两个 APK 安装包: v1.6.2 与 v1.6.1)*
          files: |
            ./AI_Tutor_v1.6.2.apk
            ./AI_Tutor_v1.6.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
