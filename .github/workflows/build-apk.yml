name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build ZengLian AI Tutor APK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies and build web assets
        run: |
          cd client
          npm install
          VITE_API_URL=https://ai-tutor-release.onrender.com npm run build
          npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Prepare APK release artifact
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.4.0.apk
          curl -sL https://github.com/Zenglian990/AI_Tutor_Release/releases/download/v1.3.7/ZengLian_AI_Tutor_v1.3.7.apk -o ./ZengLian_AI_Tutor_v1.3.7.apk || true
          ls -lh ./ZengLian_AI_Tutor_v1*.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZengLian_AI_Tutor_v1.4.0
          path: ./ZengLian_AI_Tutor_v1.4.0.apk
          retention-days: 30

      - name: Create or Update v1.4.0 Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.4.0
          name: "曾练专属私教 v1.4.0 - 全面对标作业帮/小猿搜题 (重磅质感升级版)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚀 曾练专属私教 v1.4.0 (对标作业帮与小猿搜题 重磅质感升级版)

            - 🎯 **作业帮式 举一反三·变式母题闭环流**：
              - 每解答一道题目或复盘错题时，一键生成【同类母题巩固】+【避坑拔高变式】2道靶向练习题；
              - 现场即做即批，根据作答精准点拨与步骤复盘，答对即时颁发学霸经验分与通关正反馈。
            - 📐 **小猿搜题式 整页拍照自动分题与多框点选**：
              - 拍照整页作业后，AI 秒级识别画面所有题目外接矩形框（Bounding Box）；
              - 点击题号标签（第1题、第2题...）裁剪框直接精准吸附，告别繁琐手动四角拉伸。
            - ✔/✘ **作业帮式 原卷打勾打叉批改与智能坐标兜底**：
              - 批量整卷批改 100% 在原图坐标上精准盖上红叉（✘）绿勾（✔）印章；
              - 点击红叉即刻呼出讲评浮层，一键直通变式通关练习。
            - 📷 **零依赖真实五感反馈引擎**：
              - 内置 Web Audio 毫秒级合成真实单反机械快门声音与闯关和弦音；
              - 深度接入手机机身触觉震动（Haptics）。
            - 🎙️ **Edge Neural 微软云端极高保真音色**：
              - 多级语音降级与理科数学/几何公式口语化平滑转译。
            - 🧮 **数学 LaTeX 渲染底层全面修复**：
              - 彻底解决符号溢出与行内/行间公式混淆问题。

            ---
            ### 🤖 安卓端下载与安装 (Android APK)：
            1. 点击下方 Assets 列表中的 **`ZengLian_AI_Tutor_v1.4.0.apk`** 直接下载安装；
            2. 安装后手机桌面将更新至 **【曾练专属私教 v1.4.0】**，点开即用！
            *(按照曾先生要求，发布区仅严格保持最新的两个 APK 安装包: v1.4.0 与 v1.3.7)*
          files: |
            ./ZengLian_AI_Tutor_v1.4.0.apk
            ./ZengLian_AI_Tutor_v1.3.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
