name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build AI Tutor Android APK (v1.7.5)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies and build web assets
        run: |
          cd client
          npm install
          VITE_API_URL=https://ai-tutor-79709693345.asia-east1.run.app npm run build
          npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x client/android/gradlew

      - name: Build Signed Release Android APK
        run: |
          cd client/android
          STORE_PASS="$(printf '%s' "${ANDROID_STORE_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n')"
          KEY_PASS="$(printf '%s' "${ANDROID_KEY_PASSWORD:-$STORE_PASS}" | tr -d '\r\n')"
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Missing Android signing secrets (ANDROID_KEYSTORE_BASE64 / ANDROID_STORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD)."
            exit 1
          fi
          KEYSTORE_ABS_PATH="$(pwd)/app/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_ABS_PATH"

          # 验证 keystore 与 key 密码兼容性（兼容 PKCS12 storepass==keypass 场景并清理潜在 Windows CRLF）
          if ! keytool -list -keystore "$KEYSTORE_ABS_PATH" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Cannot open keystore with ANDROID_STORE_PASSWORD and ANDROID_KEY_ALIAS."
            rm -f "$KEYSTORE_ABS_PATH"
            exit 1
          fi

          # 通过 keytool 实际验证私钥解密口令；若 KEY_PASS 失败而 STORE_PASS 可解则自动回退至 STORE_PASS
          if ! keytool -importkeystore -srckeystore "$KEYSTORE_ABS_PATH" -srcstorepass "$STORE_PASS" -srcalias "$KEY_ALIAS" -srckeypass "$KEY_PASS" -destkeystore /tmp/verify_key.p12 -deststoretype PKCS12 -deststorepass "$STORE_PASS" -noprompt >/dev/null 2>&1; then
            rm -f /tmp/verify_key.p12
            if keytool -importkeystore -srckeystore "$KEYSTORE_ABS_PATH" -srcstorepass "$STORE_PASS" -srcalias "$KEY_ALIAS" -srckeypass "$STORE_PASS" -destkeystore /tmp/verify_key.p12 -deststoretype PKCS12 -deststorepass "$STORE_PASS" -noprompt >/dev/null 2>&1; then
              echo "Notice: Using STORE_PASS as KEY_PASS (PKCS12 unified password)."
              KEY_PASS="$STORE_PASS"
            else
              echo "::error::Private key decryption failed for alias '$KEY_ALIAS' with both KEY_PASS and STORE_PASS."
              rm -f "$KEYSTORE_ABS_PATH" /tmp/verify_key.p12
              exit 1
            fi
          fi
          rm -f /tmp/verify_key.p12

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_ABS_PATH" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS" \
            -PRELEASE_STORE_FILE="$KEYSTORE_ABS_PATH" \
            -PRELEASE_STORE_PASSWORD="$STORE_PASS" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASS" \
            --stacktrace
          rm -f "$KEYSTORE_ABS_PATH"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare APK release artifact
        run: |
          cp client/android/app/build/outputs/apk/release/app-release.apk ./AI_Tutor_v1.7.5.apk
          ls -lh ./AI_Tutor_v1.7.5.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Tutor_v1.7.5
          path: ./AI_Tutor_v1.7.5.apk
          retention-days: 30

      - name: Create or Update v1.7.5 Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.7.5
          name: "AI 智慧私教 (1-12年级) v1.7.5 - 全学段K12强化 · Gemini 3满血引擎 · 生产安全与GCS持久化"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚀 AI 智慧私教（1-12年级全学段）v1.7.5 正式版

            - 🎓 **1-12 年级（小学·初中·高中）全学段深度闭环**：
              - 完整保留并深度强化高中新高考体系：150 分制新高考模考（防重复、严学段隔离、多选完整判分、全真考场防秒交/防跳题）、KaTeX 公式自愈零报错、高中圆锥曲线与离心率交互沙盒、初/高中公式宝典分流、真实 1-12 年级课标章节目录。
              - 全新 **Google Gemini 3 Flash** 默认云端推理引擎（含 `gemini-3.1-flash-lite` 容灾切换），覆盖全科数理推导、高考作文五维思辨精批与英语情景对练真实文法诊断。
            - 🔒 **生产级安全防线与多孩服务端权威隔离**：
              - 全链路服务端权威签发 `stu_*` 隔离档案、防 IDOR 越权、配额防绕过、生产异常脱敏，以及 GCP Secret Manager 零明文托管。
              - 云端 Cloud Run Gen2 + GCS 流式事务快照持久化（[stateSync.js](server/services/stateSync.js)），容器扩缩容零数据丢失。
            - 📱 **移动端与 PWA 体验全面升级**：
              - 375px 窄屏全核心弹窗与顶栏多孩入口响应式适配、全站亮色模式高对比度、番茄钟墨水屏一键退出、PWA `NetworkFirst` 升级自愈策略防旧缓存锁死。
            - 💯 **全栈自动化测试持续绿灯**：
              - 后端 43 套（238 项用例）+ 前端 27 套（111 项用例）100% PASS。

            ---
            ### 📥 安装与使用
            - **Android 端**：下载下方 **`AI_Tutor_v1.7.5.apk`**（已使用正式发布密钥签名）直接安装；
            - **iOS 端**：使用 Safari 打开 [线上云端版](https://ai-tutor-79709693345.asia-east1.run.app) 添加到主屏幕，或下载下方 `AI_Tutor_v1.7.5.ipa`；
            - **Web / PC 端**：直达 [https://ai-tutor-79709693345.asia-east1.run.app](https://ai-tutor-79709693345.asia-east1.run.app)。
          files: |
            ./AI_Tutor_v1.7.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
