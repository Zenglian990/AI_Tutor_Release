name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build ZengLian AI Tutor APK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies and build web assets
        run: |
          cd client
          npm install
          npm run build
          npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Prepare APK release artifact
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.3.2.apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.3.1.apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.3.0.apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.0.0.apk
          ls -lh ./ZengLian_AI_Tutor_v1*.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZengLian_AI_Tutor_v1.3.2
          path: ./ZengLian_AI_Tutor_v1.3.2.apk
          retention-days: 30

      - name: Create or Update v1.3.2 Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.3.2
          name: "曾练专属私教 v1.3.2 - 智能语音录音修复 & 曾先生专属管理员控制台 (最新发布)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 📱 曾练专属私教 v1.3.2 (Build 2026.09.23)

            - 🎙️ **智能语音输入全面修复**：
              - 增强原生 Android WebView 动态麦克风录音权限检测与弹窗申请；
              - 服务端引入二进制音频文件头 (Magic Bytes) 自动嗅探 (WebM/WAV/MP4/OGG/AAC)，彻底避免 MIME 类型误判导致 Gemini 报错；
              - 语音录音过程配备实时动态状态条、15秒超时自动保护与“说完了直接发送”按钮。
            - 🛡️ **曾先生专属管理控制台 (PIN码安全锁)**：
              - 整合获客营销裂变海报、批量卡密生成/导出、AI大模型密钥 (Jev/Gemini/DeepSeek)、后端域名及安全锁设置；
              - 纯净化普通学生/家长界面，仅曾先生凭 6 位安全 PIN 码开启管理中枢。
            - 📱 **原生 Android 深度适配**：版本升级为 v1.3.2 (versionCode 5)，支持无缝覆盖安装更新。

            ---
            ### 🤖 安卓端下载与安装 (Android APK)：
            1. 点击下方 Assets 列表中的 **`ZengLian_AI_Tutor_v1.3.2.apk`** 直接下载；
            2. 在安卓手机或平板文件管理器中打开该 APK 进行安装（或直接覆盖更新）；
            3. 安装完成后，手机桌面上将出现 **【曾练专属私教】** 应用图标，点开即用！
          files: |
            ./ZengLian_AI_Tutor_v1.3.2.apk
            ./ZengLian_AI_Tutor_v1.3.1.apk
            ./ZengLian_AI_Tutor_v1.3.0.apk
            ./ZengLian_AI_Tutor_v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to v1.3.0 and v1.0.0-apk Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.3.0
          name: "曾练专属私教 v1.3.0 - 0秒即读本地原声与全平台自适配更新"
          draft: false
          prerelease: false
          files: |
            ./ZengLian_AI_Tutor_v1.3.1.apk
            ./ZengLian_AI_Tutor_v1.3.0.apk
            ./ZengLian_AI_Tutor_v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
