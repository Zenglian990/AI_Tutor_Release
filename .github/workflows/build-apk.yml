name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build ZengLian AI Tutor APK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies and build web assets
        run: |
          cd client
          npm install
          VITE_API_URL=https://ai-tutor-79709693345.asia-east1.run.app npm run build
          npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Prepare APK release artifact
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./AI_Tutor_v1.6.3.apk
          curl -sL https://github.com/Zenglian990/AI_Tutor_Release/releases/download/v1.6.2/AI_Tutor_v1.6.2.apk -o ./AI_Tutor_v1.6.2.apk || true
          ls -lh ./AI_Tutor_v1*.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Tutor_v1.6.3
          path: ./AI_Tutor_v1.6.3.apk
          retention-days: 30

      - name: Create or Update v1.6.3 Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.6.3
          name: "曾练专属私教 v1.6.3 - FSRS现代科学记忆调度·Mafs可交互数学画板·费曼以教代学同桌模式"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚀 曾练专属私教 v1.6.3 (FSRS科学记忆调度 · Mafs交互画板 · 费曼以教代学模式)

            - 🧠 **FSRS-v4.5 现代自由间隔重复调度引擎 (Free Spaced Repetition Scheduler)**：
              - 告别经典 SM-2 粗糙固化间隔，采用 17 维认知参数驱动的动态遗忘曲线方程；
              - 精准量化记忆稳定性（Stability $S$）、认知难度（Difficulty $D$）与实时提取概率（Retrievability $R$）；
              - 自适应“重来/困难/良好/简单”四级反馈，实现错题复习周期的指数级精准调度，平滑兼容旧题库。
            - 📐 **Mafs 原生手势/拖拽交互数学与几何画板 (Interactive Math Canvas)**：
              - 告别死板静态图片与生硬只读公式，支持学生通过触控拖拽动态交互探索数学定理；
              - 内置“二次函数顶点抛物线探索器”：拖拽顶点与开合度，实时联动 $y = a(x-h)^2 + k$ 解析式与图像拓扑；
              - 内置“勾股定理与直角三角形交互验证板”：拖拽直角顶点动态演示边长变化与勾股数等式成立，直观顿悟几何规律；
              - 无缝内嵌至私教聊天流（````interactive-math`）与几何沙盒实验室中。
            - 🧑‍🤝‍🧑 **费曼学习法“虚拟小同桌”反向提问系统 (Feynman Peer Roleplay System)**：
              - 智能私教化身“困惑的好奇同桌小明”，由学生主动把知识点“讲给同桌听”，实现最高层级的以教代学；
              - 具备三维深度讲授评价机制：**科学准确性 (Accuracy 40%)、逻辑条理性 (Logic 35%)、通俗类比度 (Analogy 25%)**；
              - 输入栏一键开关“费曼以教代学”模式，实时提示当前辅导角色与讲授任务。
            - 📍 **延续 v1.6.2 续学断点记忆与苏格拉底脚手架**：
              - 永久记住学生学到哪儿、错题根因与未完课题，随时中断随时接续，彻底告别重复讲起！
            - 💯 **全栈极速高质量工程交付**：
              - 184 项服务端单元测试 100% 通过，31 项客户端核心组件用例全面绿灯！

            ---
            ### 🤖 安卓端下载与安装 (Android APK)：
            1. 点击下方 Assets 列表中的 **`AI_Tutor_v1.6.3.apk`** 直接下载安装；
            2. 安装后手机桌面将更新至 **【曾练专属私教 v1.6.3】**，点开即用！
            *(按照规范，发布区严格保持最新的两个 APK 安装包: v1.6.3 与 v1.6.2)*
          files: |
            ./AI_Tutor_v1.6.3.apk
            ./AI_Tutor_v1.6.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
