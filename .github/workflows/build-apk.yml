name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build AI Tutor Android APK (v1.7.7)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies and build web assets
        run: |
          cd client
          npm install
          VITE_API_URL=https://ai-tutor-79709693345.asia-east1.run.app npm run build
          npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x client/android/gradlew

      - name: Build Signed Release Android APK
        run: |
          cd client/android
          STORE_PASS="$(printf '%s' "${ANDROID_STORE_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n')"
          KEY_PASS="$(printf '%s' "${ANDROID_KEY_PASSWORD:-$STORE_PASS}" | tr -d '\r\n')"
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Missing Android signing secrets (ANDROID_KEYSTORE_BASE64 / ANDROID_STORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD)."
            exit 1
          fi
          KEYSTORE_ABS_PATH="$(pwd)/app/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_ABS_PATH"

          # 验证 keystore 与 key 密码兼容性（兼容 PKCS12 storepass==keypass 场景并清理潜在 Windows CRLF）
          if ! keytool -list -keystore "$KEYSTORE_ABS_PATH" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Cannot open keystore with ANDROID_STORE_PASSWORD and ANDROID_KEY_ALIAS."
            rm -f "$KEYSTORE_ABS_PATH"
            exit 1
          fi

          # 使用与 AGP KeystoreHelper 相同的 JDK KeyStore.getKey() 实测私钥口令（兼容 PKCS12 忽略独立 -keypass 行为）
          cat <<'EOF' > /tmp/CheckKeystore.java
          import java.io.File;
          import java.security.KeyStore;
          public class CheckKeystore {
            public static void main(String[] args) throws Exception {
              File f = new File(args[0]);
              char[] sp = args[1].toCharArray();
              String alias = args[2];
              char[] kp = args[3].toCharArray();
              KeyStore ks = KeyStore.getInstance(f, sp);
              try {
                if (ks.getKey(alias, kp) != null) { System.out.println("KEY_PASS"); return; }
              } catch (Exception ignored) {}
              if (ks.getKey(alias, sp) != null) { System.out.println("STORE_PASS"); return; }
              System.exit(2);
            }
          }
          EOF
          RESOLVED_MODE="$(java /tmp/CheckKeystore.java "$KEYSTORE_ABS_PATH" "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" | tr -d '\r\n')"
          rm -f /tmp/CheckKeystore.java
          if [ "$RESOLVED_MODE" = "STORE_PASS" ]; then
            echo "Notice: PKCS12 keystore uses unified store password for private key."
            KEY_PASS="$STORE_PASS"
          elif [ "$RESOLVED_MODE" != "KEY_PASS" ]; then
            echo "::error::Unable to unlock private key in keystore with either KEY_PASS or STORE_PASS."
            rm -f "$KEYSTORE_ABS_PATH"
            exit 1
          fi

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_ABS_PATH" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS" \
            -PRELEASE_STORE_FILE="$KEYSTORE_ABS_PATH" \
            -PRELEASE_STORE_PASSWORD="$STORE_PASS" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASS" \
            --stacktrace
          rm -f "$KEYSTORE_ABS_PATH"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare APK release artifact
        run: |
          cp client/android/app/build/outputs/apk/release/app-release.apk ./AI_Tutor_v1.7.7.apk
          ls -lh ./AI_Tutor_v1.7.7.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Tutor_v1.7.7
          path: ./AI_Tutor_v1.7.7.apk
          retention-days: 30

      - name: Create or Update v1.7.7 Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.7.7
          name: "AI 智慧私教 (1-12年级) v1.7.7 - 理科验证引擎重构 · 新高考多选与圆锥曲线 · 家长10秒闭环与配额变现体系"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚀 AI 智慧私教（1-12年级全学段）v1.7.7 正式版

            - 🧮 **核心 AI 链路与理科引擎全面根治（10 项 P0 缺陷清零）**：
              - 修复单 Gemini Key 偶发超时引发全站 10 秒冷却并盲跳未配置 DeepSeek 的雪崩降级，全量关闭作文/模考/周报/通关测评重思考链并支持顶层 JSON 数组与 `thought` 块剥离；
              - 彻底修复 `ExactFraction` 负数 `NaN`、完全平方因式分解冗余 `/1` 与草稿纸高三导数/极值验算误判，分步草稿纸按当前题目动态初始化；
              - 模考考场消灭多选题双控件冲突、补齐判断题与新高考数学多选题、补全生物/历史/地理/政治独立真学科题库，主观题 AI 异常改标待复核；
              - 修复闭区间 Mermaid 语法报错、错题本 Mermaid 渲染、断层溯源「AI 专项补强」直通聊天与首页「生成 A4 错题卷」自动拉取云端错题；
              - 统一全站连胜、周历、学情统计、AI 周报与家长远程视图至北京时间（UTC+8）。
            - 🎨 **全学段功能深度精修（24 项 P1 升级）**：
              - 动态几何升级高中**椭圆 / 双曲线 / 抛物线**三合一圆锥曲线沙盒；公式手册清除化学卡片裸 `\text{}` 并补全高中与小学核心公式；
              - 作文诊所新增命题要求与 1–3 年级看图写话传图、五维分与总分严格算术对齐；
              - 手机端 375px 保留快捷学科选择器、修复 A4 预览与长按钮遮挡，深色/浅色/墨水屏三主题全局适配；
              - 站长后台修复鉴权/保存/测连/免二次密钥改 PIN，新增全站运营统计与 JSON 导出；补齐高中语文/政治/化学/生物/历史/地理 18 个知识图谱主干节点。
            - 💼 **Phase 3 家长留存与商业转化闭环**：
              - 首页新增免费额度可视化进度条与满额 VIP/自带 Key 平滑转化入口；
              - 新增家长 10 秒闭环一键「周末错题清零卷」，连胜勋章真实绑定数据库已消灭错题数并防连点白嫖护盾。
            - 💯 **全栈自动化测试 100% 绿灯**：
              - 后端 252 项测试（18 套）+ 前端 114 项 Vitest 单测（28 套）100% PASS。

            ---
            ### 📥 安装与使用
            - **Android 端**：下载下方 **`AI_Tutor_v1.7.7.apk`**（`versionCode 33`，正式密钥签名）覆盖安装即可；
            - **iOS 端**：使用 Safari 打开 [线上云端版](https://ai-tutor-79709693345.asia-east1.run.app) 添加到主屏幕，或下载下方 `AI_Tutor_v1.7.7.ipa`；
            - **Web / PC 端**：直达 [https://ai-tutor-79709693345.asia-east1.run.app](https://ai-tutor-79709693345.asia-east1.run.app)。
          files: |
            ./AI_Tutor_v1.7.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
