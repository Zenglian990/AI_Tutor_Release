name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build ZengLian AI Tutor APK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies and build web assets
        run: |
          cd client
          npm install
          npm run build
          npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Prepare APK release artifact
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.3.3.apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.3.2.apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.3.1.apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.3.0.apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.0.0.apk
          ls -lh ./ZengLian_AI_Tutor_v1*.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZengLian_AI_Tutor_v1.3.3
          path: ./ZengLian_AI_Tutor_v1.3.3.apk
          retention-days: 30

      - name: Create or Update v1.3.3 Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.3.3
          name: "曾练专属私教 v1.3.3 - 基础偏好设置与曾先生管理后台彻底剥离 (最新发布)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 📱 曾练专属私教 v1.3.3 (Build 2026.09.23)

            - ⚙️ **纯净基础设置彻底剥离**：
              - 顶栏恢复无密码的 **⚙️ 基础偏好设置** 窗口，普通学生与家长可自由切换教材版本（人教/北师大/苏教等）、语音朗读开关、三位名师形象（智多星/聪聪狮/晓晴姐）、护眼墨水屏与界面语言；
              - 彻底移除普通设置中混杂的所有商业发卡、微信二维码海报及底层大模型密钥，保持学生端纯粹专注。
            - 🔒 **曾先生专属管理后台完全隐藏**：
              - 顶栏完全移除 `🛡️` 盾牌按钮，普通用户无任何管理员痕迹感知；
              - 仅曾先生本人可通过**连续快速点击左上角【🎓】图标 5 次**暗号呼出管理认证，进入专属变现发卡、营销裂变与 AI 密钥中枢。
            - 📱 **原生 Android 深度适配**：版本升级为 v1.3.3 (versionCode 6)，支持无缝覆盖安装更新。

            ---
            ### 🤖 安卓端下载与安装 (Android APK)：
            1. 点击下方 Assets 列表中的 **`ZengLian_AI_Tutor_v1.3.3.apk`** 直接下载；
            2. 在安卓手机或平板文件管理器中打开该 APK 进行安装（或直接覆盖更新）；
            3. 安装完成后，手机桌面上将出现 **【曾练专属私教】** 应用图标，点开即用！
          files: |
            ./ZengLian_AI_Tutor_v1.3.3.apk
            ./ZengLian_AI_Tutor_v1.3.2.apk
            ./ZengLian_AI_Tutor_v1.3.1.apk
            ./ZengLian_AI_Tutor_v1.3.0.apk
            ./ZengLian_AI_Tutor_v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to v1.3.0 and v1.0.0-apk Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.3.0
          name: "曾练专属私教 v1.3.0 - 0秒即读本地原声与全平台自适配更新"
          draft: false
          prerelease: false
          files: |
            ./ZengLian_AI_Tutor_v1.3.1.apk
            ./ZengLian_AI_Tutor_v1.3.0.apk
            ./ZengLian_AI_Tutor_v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
