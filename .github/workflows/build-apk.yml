name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build ZengLian AI Tutor APK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies and build web assets
        run: |
          cd client
          npm install
          npm run build
          npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Prepare APK release artifact
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.3.4.apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.3.3.apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.3.2.apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.3.1.apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.3.0.apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.0.0.apk
          ls -lh ./ZengLian_AI_Tutor_v1*.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZengLian_AI_Tutor_v1.3.4
          path: ./ZengLian_AI_Tutor_v1.3.4.apk
          retention-days: 30

      - name: Create or Update v1.3.4 Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.3.4
          name: "曾练专属私教 v1.3.4 - 智能规划免令牌与管理员万能密码直达 (最新发布)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 📱 曾练专属私教 v1.3.4 (Build 2026.09.24)

            - 🎯 **智能学习规划全面免密放行**：
              - 彻底解决“生成规划失败: 需要身份验证”问题。将普通学生学习接口（智能规划、AI伴读、错题本、名校模考等）与管理员敏感接口（模型Key配置、发卡等）进行严格权限分层，普通学生端完全免令牌顺畅使用。
            - 🔑 **曾先生管理后台万能密码与一键找回**：
              - 密码框支持输入万能特权密码 `888888` 或 `000000` 秒级直达；
              - 密码框下方内置“⚡ 忘记密码？一键重置为 888888 并开门”通道，一键解锁。
            - ⚙️ **纯净基础设置与暗号 5 击激活**：
              - 顶栏无密码齿轮设置专供学生/家长偏好调节；
              - 连续点击左上角【🎓】图标 5 次唤出曾先生专属变现与AI控制中枢。
            - 📱 **原生 Android 深度适配**：版本升级为 v1.3.4 (versionCode 7)，支持无缝覆盖安装更新。

            ---
            ### 🤖 安卓端下载与安装 (Android APK)：
            1. 点击下方 Assets 列表中的 **`ZengLian_AI_Tutor_v1.3.4.apk`** 直接下载；
            2. 在安卓手机或平板文件管理器中打开该 APK 进行安装（或直接覆盖更新）；
            3. 安装完成后，手机桌面上将出现 **【曾练专属私教】** 应用图标，点开即用！
          files: |
            ./ZengLian_AI_Tutor_v1.3.4.apk
            ./ZengLian_AI_Tutor_v1.3.3.apk
            ./ZengLian_AI_Tutor_v1.3.2.apk
            ./ZengLian_AI_Tutor_v1.3.1.apk
            ./ZengLian_AI_Tutor_v1.3.0.apk
            ./ZengLian_AI_Tutor_v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to v1.3.0 and v1.0.0-apk Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.3.0
          name: "曾练专属私教 v1.3.0 - 0秒即读本地原声与全平台自适配更新"
          draft: false
          prerelease: false
          files: |
            ./ZengLian_AI_Tutor_v1.3.1.apk
            ./ZengLian_AI_Tutor_v1.3.0.apk
            ./ZengLian_AI_Tutor_v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
