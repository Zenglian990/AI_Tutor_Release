name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build ZengLian AI Tutor APK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies and build web assets
        run: |
          cd client
          npm install
          npm run build
          npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Prepare APK release artifact
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.0.0.apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./ZengLian_AI_Tutor_v1.3.0.apk
          ls -lh ./ZengLian_AI_Tutor_v1*.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZengLian_AI_Tutor_v1.3.0
          path: ./ZengLian_AI_Tutor_v1.3.0.apk
          retention-days: 30

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-apk
          name: "曾练专属私教 移动双端独立安装包 (Android APK + iOS IPA v1.3.0)"
          draft: false
          prerelease: false
          body: |
            ## 📱 曾练专属私教 - 移动双端安装指南 (Android + iOS)

            本方案专为中小学生（1-9年级）与家长端深度定制，覆盖人教版/部编版，智能苏格拉底分步启发式精讲，内嵌曾先生微信私教裂变引流方案与全功能知识图谱辅导系统。

            ---
            ### 🤖 安卓端下载与安装 (Android APK)：
            1. 点击下方 Assets 列表中的 **`ZengLian_AI_Tutor_v1.3.0.apk`** 直接下载（推荐，含 0 秒即读本地原声）；
            2. 在安卓手机或平板文件管理器中打开该 APK 进行安装（或直接覆盖更新）；
            3. 若系统弹出“未知来源应用安装提示”，点击“允许安装”或“信任”即可；
            4. 安装完成后，手机桌面上将出现 **【曾练专属私教】** 应用图标，点开即用！

            ---
            ### 🍎 苹果端下载与使用 (iPhone / iPad iOS)：
            - **方案 A（最推荐·免签名免越狱·1秒添加至桌面）**：
              1. 用 iPhone 自带的 **Safari 浏览器** 打开云端地址：`https://ai-tutor-release.onrender.com`
              2. 点击 Safari 底部中央的 **【分享按钮 📤】**；
              3. 选择 **【添加到主屏幕】** ➔ 点击右上角 **【添加】**；
              4. 手机桌面上立即出现 **【曾练专属私教】** 独立全屏 App，支持原生相机高清拍题！
            - **方案 B（IPA 原生安装包）**：
              1. 点击下方 Assets 列表中的 **`ZengLian_AI_Tutor_v1.0.0.ipa`** 下载；
              2. 可通过爱思助手、AltStore、Sideloadly 或企业证书一键导入 iPhone 安装。
          files: |
            ./ZengLian_AI_Tutor_v1.0.0.apk
            ./ZengLian_AI_Tutor_v1.3.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
