name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'client/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    name: Build AI Tutor iOS App (v1.7.6)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root & client dependencies
        run: |
          npm install
          cd client
          npm install
          VITE_API_URL=https://ai-tutor-79709693345.asia-east1.run.app npm run build
          npx cap sync ios

      - name: Verify Xcode toolchain
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Build iOS Project & Generate IPA
        run: |
          cd client/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -derivedDataPath build -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../../../AI_Tutor_v1.7.6.ipa Payload
          ls -lh ../../../AI_Tutor_v1.7.6.ipa

      - name: Compress iOS Xcode Project Bundle
        run: |
          cd client/ios
          zip -qr ../../AI_Tutor_v1.7.6_iOS_Project.zip App -x "App/build/*" "App/Payload/*"

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: AI_Tutor_v1.7.6_iOS_Package
          path: |
            ./AI_Tutor_v1.7.6.ipa
            ./AI_Tutor_v1.7.6_iOS_Project.zip
          retention-days: 30

      - name: Attach iOS Assets to v1.7.6 Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.7.6
          draft: false
          prerelease: false
          files: |
            ./AI_Tutor_v1.7.6.ipa
            ./AI_Tutor_v1.7.6_iOS_Project.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
