version: '3.8'

services:
  ai-tutor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenglian_ai_tutor
    image: zenglian-ai-tutor:1.5.5
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "scripts/health-check.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      org.opencontainers.image.title: "曾练专属私教 (ZengLian AI Tutor)"
      org.opencontainers.image.version: "1.5.5"
      org.opencontainers.image.description: "专为1-9年级量身定制的开源 RAG AI 教辅智能体"
